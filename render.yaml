services:
  - type: static
    name: medonthan-frontend
    staticPublishPath: ./dist
    buildCommand: pnpm install --no-frozen-lockfile && pnpm run build
    headers:
      # Long-term cache for Vite-hashed assets (content-hashed filenames, safe to cache forever)
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Prevent browser from caching HTML documents
      # Root cause fix: browsers were caching stale index.html from old deploys,
      # causing /music to load old JS that redirected to /games
      - path: /
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /music
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /games
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /404.html
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /200.html
        name: Cache-Control
        value: no-cache, must-revalidate
    routes:
      # SPA fallback: all unmatched paths serve index.html (client-side routing)
      - type: rewrite
        source: /*
        destination: /index.html
